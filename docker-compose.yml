services:
  app-dev:
    image: satellite-pass-app:dev
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: 80
      CONFIG_FILENAME: config_files/conf_test1
    ports:
      - "12346:80"
    build:
      context: .
      target: development
  

  app-prod:
    image: satellite-pass-app:prod
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: 80
      CONFIG_FILENAME: 
    ports:
      - "12345:80"
      - "5000:80"
    build:
      context: .
      target: production
