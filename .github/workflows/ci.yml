name: CI Pipeline

on:
  push:
    branches: main
  pull_request:
    branches: main

env:
  N2YO_APIKEY: ${{ secrets.N2YO_APIKEY }}
  OPENCAGE_APIKEY: ${{ secrets.OPENCAGE_APIKEY }}

jobs:
  testing:
    runs-on: ubuntu-latest

    services:
      docker:
        image: docker:dind
        options: --privileged

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          sudo apt-get update
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run ruff lint
        run: |
          ruff check .

      - name: Run ruff format check
        run: |
          ruff format --check .

      - name: Run mypy
        run: |
          mypy lib

      - name: Run pytest
        run: |
          pytest -q

      - name: Build production image
        run: |
          docker build --target production -t satellite-pass-app:test .

      - name: Run production container smoke test
        run: |
          id=$(docker run -d satellite-pass-app:test)
          sleep 3
          docker logs "$id"
          docker inspect -f "{{.State.Running}}" "$id"
          docker stop "$id"